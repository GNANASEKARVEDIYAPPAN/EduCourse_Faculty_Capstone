<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>EduCourse</title><link rel="stylesheet" href="{{url_for('static',filename='style.css')}}"></head><body><header><strong>EduCourse</strong><nav><a href="{{url_for('dashboard')}}">Dashboard</a>{% for p in parts|default([]) %}<a href="{{url_for('part',number=loop.index)}}">{{loop.index}}. {{p}}</a>{% endfor %}</nav><span>{{session.username}} · <a href="{{url_for('logout')}}">Logout</a></span></header><main>{% with messages=get_flashed_messages() %}{% for m in messages %}<p class="alert">{{m}}</p>{% endfor %}{% endwith %}{% block body %}{% endblock %}</main></body></html>
